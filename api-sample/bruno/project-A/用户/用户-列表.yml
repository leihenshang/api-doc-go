info:
  name: 用户-列表
  type: http
  seq: 1

http:
  method: GET
  url: /api/user/list?name=tzq
  params:
    - name: name
      value: tzq
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## 简要描述
  - 用户查询接口

  ## 请求URI
  - `/apis/xxxxxx.com/test/user/v1/users/:id`

  ## 请求方式
  - GET

  ## 请求头
  - **Content-Type**: application/json
  - **Authorization**: {{Token}}
  - **Referer**: https://{{服务器地址}}

  ## 请求参数
  无

  ## 返回用户资源字段说明
  |参数名|类型|说明|
  |:----    |:----- |-----   |
  |id |string |用户ID  
  |name |string |用户名称 |
  |account |string |用户账号 |
  |userLevel | 枚举 | 角色类型（见角色类型枚举）|
  |telephone |string |电话 |
  |email |string |邮箱 |
  |disabled |bool |是否被禁用 |
  |comment |string |备注 |
  |userGroups |用户组资源数组 | 所属用户组列表 |


  ## 响应示例
