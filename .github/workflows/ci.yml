name: CI

# 一键门禁与本地一致：bash scripts/check.sh（gofmt → build → vet → test -race
# → 前端 type-check → eslint → 前端单测 → vite build）。
#
# 【已关闭自动触发】2026-10-17：push / pull_request 不再自动跑。
# 需要时在 GitHub Actions 页面手动 Run workflow，或把下面 on: 段落恢复为：
#   on:
#     push:
#       branches: [master, main]
#     pull_request:
#     workflow_dispatch:

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # server 是独立 module，缓存 key 要指向它
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        run: npm ci
        working-directory: web

      - name: 一键门禁
        run: bash scripts/check.sh
