name: CI

# 一键门禁与本地一致：bash scripts/check.sh（gofmt → build → vet → test -race
# → 前端 type-check → eslint → 前端单测 → vite build）。
#
# 【已关闭自动触发】2026-10-17：push / pull_request 不再自动跑。
# 需要时在 GitHub Actions 页面手动 Run workflow，或把下面 on: 段落恢复为：
#   on:
#     push:
#       branches: [master, main]
#     pull_request:
#     workflow_dispatch:

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # server 是独立 module，缓存 key 要指向它
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        run: npm ci
        working-directory: web

      - name: 一键门禁
        run: bash scripts/check.sh

  # 审核 H-14：PostgreSQL 方言的迁移脚本必须在真实 PG 上跑一遍 up/down。
  # 本地无 PG 时该测试自动跳过（TEST_POSTGRES_DSN 为空）。
  migrate-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apidoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      - name: PostgreSQL 迁移 up/down
        working-directory: server
        env:
          TEST_POSTGRES_DSN: "host=localhost user=postgres password=postgres dbname=apidoc_test port=5432 sslmode=disable TimeZone=UTC"
          TEST_POSTGRES_RESET: "1"
        run: go test ./internal/database -run TestPostgresMigrationsApply -count=1 -v
