# T11：CI 门禁。与 scripts/check.sh 完全同源，本地能过、CI 就能过。
# 说明：仓库当前未配置远程（无 git remote），本文件在接入 GitHub 后自动生效。
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 一键校验（gofmt / build / vet / test / vue-tsc / eslint / vite build）
        run: bash scripts/check.sh
