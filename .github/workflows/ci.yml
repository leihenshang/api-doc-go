name: CI

# 一键门禁与本地一致：bash scripts/check.sh（gofmt → build → vet → test -race
# → 前端 type-check → eslint → vite build）。
# 说明：仓库暂无 git remote，接入 GitHub 后本文件自动生效。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # server 是独立 module，缓存 key 要指向它
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        run: npm ci
        working-directory: web

      - name: 一键门禁
        run: bash scripts/check.sh
