info:
  name: 同步_全量快照
  type: http
  seq: 4

http:
  method: GET
  url: "{{host}}/api/sync/snapshot?project_id=1&offset=0&limit=200"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 首次接入 / gap 重建 / 本地清空时的全量分页拉取（S4）

  ## 请求 URI
  - `/api/sync/snapshot?project_id={project_id}&offset={offset}&limit={limit}`

  ## 请求方式
  - GET

  ## 鉴权
  - 请求头 `Authorization: Bearer <PAT 或 JWT>`

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |project_id|是|int|项目 ID|
  |offset|int|int|分页偏移（默认 0）|
  |limit|int|int|单次条数上限（默认 200）|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": { "cursor", "items", "has_more", "offset" } }`

  ## 响应字段
  |字段名|类型|说明|
  |:--|:--|:--|
  |cursor|int|快照时刻的游标|
  |items|array|条目列表（结构同 changes）|
  |has_more|bool|是否还有更多|
  |offset|int|当前偏移|

  ## 备注
  - 两阶段应用（R7）：先分组后条目，保证目录结构完整。
