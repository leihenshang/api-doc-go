info:
  name: 同步_游标探测
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/api/sync/state?project_id=1"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 廉价探测"要不要拉"（S2/S4）

  ## 请求 URI
  - `/api/sync/state?project_id={project_id}`

  ## 请求方式
  - GET

  ## 鉴权
  - 请求头 `Authorization: Bearer <PAT 或 JWT>`

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |project_id|是|int|项目 ID|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": { "cursor", "oldest_available" } }`

  ## 响应字段
  |字段名|类型|说明|
  |:--|:--|:--|
  |cursor|int|项目当前游标（change_log 最大 id）|
  |oldest_available|int|流水窗口下界（gap 判定用）|

  ## 备注
  - 本地 `cursor < 服务端 cursor` 时需要增量拉取。
  - `since < oldest_available` 时 `changes` 返回 `gap:true`，须改走 snapshot。
