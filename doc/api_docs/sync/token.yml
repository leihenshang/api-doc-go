info:
  name: 用户_访问令牌
  type: http
  seq: 6

http:
  method: POST
  url: "{{host}}/api/user/token"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 创建 / 列表 / 查看明文 / 删除 PAT（个人访问令牌，S7/S15）；明文仅创建时返回一次，此后由后端解密回显

  ## 请求 URI
  - `POST /api/user/token` 创建
  - `GET /api/user/token` 列表
  - `GET /api/user/token/reveal?id={id}` 查看本人令牌明文（服务端解密）
  - `DELETE /api/user/token?id={id}` 删除（物理删除，不可恢复）

  ## 请求方式
  - POST / GET / DELETE

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`

  ## 请求参数（POST）
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |name|是|string|令牌名称|
  |scopes|string|string|作用域（预留）|
  |days|int|int|有效天数（0 = 不过期）|

  ## 统一响应
  - POST：`{ "code": 200, "data": { "token": "pat_...", "info": { ... } } }`
  - GET：`{ "code": 200, "data": [ { "id", "name", "expire_at", "revoked", ... } ] }`
  - GET reveal：`{ "code": 200, "data": { "token": "pat_..." } }`
  - DELETE：`{ "code": 200, "data": null }`

  ## 备注
  - 落库存 sha256(token) 供鉴权 + AES-256-GCM 密文（token_cipher，密钥派生自 JWT_SECRET）供回显；明文不落明文。
  - 旧令牌 token_cipher 为空：reveal 返回 `该令牌未保存明文（旧令牌），请删除后重新创建`。
  - 客户端用 `Authorization: Bearer <PAT>` 调用 `/api/sync/*`。
