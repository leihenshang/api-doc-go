info:
  name: 同步_增量拉取
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/api/sync/changes?project_id=1&since=0&limit=200"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 增量拉取变更流水（S3/S4）

  ## 请求 URI
  - `/api/sync/changes?project_id={project_id}&since={since}&limit={limit}`

  ## 请求方式
  - GET

  ## 鉴权
  - 请求头 `Authorization: Bearer <PAT 或 JWT>`

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |project_id|是|int|项目 ID|
  |since|int|int|本地游标（0 = 全量）|
  |limit|int|int|单次条数上限（默认 200）|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": { "cursor", "items", "has_more", "gap" } }`

  ## 响应字段
  |字段名|类型|说明|
  |:--|:--|:--|
  |cursor|int|本次拉取后的游标|
  |items|array|变更条目列表|
  |items[].type|string|group / api / doc|
  |items[].uid|string|条目 ext_uid|
  |items[].op|string|upsert / delete|
  |items[].payload|object|条目全量载荷（delete 时为空）|
  |items[].item_rev|int|条目版本（change_log.id）|
  |items[].deleted|bool|是否删除（tombstone）|
  |has_more|bool|是否还有更多|
  |gap|bool|true 表示 since 早于流水保留窗口，须改走 snapshot|

  ## 备注
  - `gap:true` 时客户端必须放弃增量、改走 `snapshot` 全量对齐。
