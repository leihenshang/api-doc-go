info:
  name: 外部库_连接创建
  type: http
  seq: 57

http:
  method: POST
  url: "{{host}}/api/database"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 外部库_连接创建

  ## 请求 URI
  - `/api/database`

  ## 请求方式
  - POST

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
|project_id|是|uint|项目 ID|
|address|是|string|主机|
|port|是|int|端口|
|username|是|string|用户名|
|password|是|string|口令（AES-GCM 加密存储，不回显）|
|database_name|是|string|库名|
|type|否|int|1 MySQL 2 PostgreSQL|
|description|否|string|备注|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
