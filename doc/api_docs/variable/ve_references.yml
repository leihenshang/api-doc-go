info:
  name: 环境_引用预检
  type: http
  seq: 68

http:
  method: GET
  url: "{{host}}/api/variable-env/references?id="
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 环境_引用预检

  ## 请求 URI
  - `/api/variable-env/references?id=`

  ## 请求方式
  - GET

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |id|是|uint|环境 ID（查询参数）|
  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
  - 返回 `{ env: {id,name,is_default}, variables: [...], blocked }`；variables 为绑定该环境的变量（值脱敏）。
    - `blocked=true` 表示当前不可删除（默认环境且项目仍有其它环境，或仍被变量引用）；前端据此禁用删除并列出引用清单。