docs: |-
  ## 简要描述
  - IP详情

  ## 请求URI
  - `/apis/test.com/global/v1/testapis`

  ## 请求方式
  - GET

  ## 请求头
  - **Content-Type**: application/json
  - **Authorization**: {{Token}}
  - **Referer**: https://{{服务器地址}}

  ## 请求参数
  |参数名|必选|类型|说明|
  |:----    |:---|:----- |-----   |
  |src_ip|是| string | ip地址 |
  |src_ips | 否 | string | ip列表(192.168.1.2,2000::1 使用英文逗号连接)|
  |from|是| string | 开始时间 |
  |to|是| string | 结束时间 |
  |page_num|是| int | 页数 |
  |page_size|是| int | 页码 |
  |domain|否| string | 域名 |


  ## 请求示例
  ```shell
  curl --location --request GET 'http://10.0.0.186:28086/apis/test.com/global/v1/testapis?src_ip=10.0.0.186&page_num=1&page_size=10&from=2026-08-19%2004%3A33%3A30&to=2026-08-19%2014%3A33%3A36' \
    --header 'Authorization: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3ODY2ODk1ODksIlVzZXJJZCI6ImNseG9uZSJ9.blTfavwKYrDizSfn3-iufNlC9HQx2pa13gHitwrY_IQ' \
    --header 'referer: https://10.0.0.72/public/' \
    --header 'Content-Type: application/json' 
  ```

  ## 返回用户资源字段说明
  |参数名|类型|说明|
  |:----    |:----- |-----   |
  |domain | string | 域名 |
  |requestTime | string | 请求时间 |
  |node | string | 节点IP |
  |content | string | 详情 |


