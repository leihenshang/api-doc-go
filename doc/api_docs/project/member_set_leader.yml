info:
  name: 成员_设负责人
  type: http
  seq: 15

http:
  method: PUT
  url: "{{host}}/api/project/leader"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 成员_设负责人

  ## 请求 URI
  - `/api/project/leader`

  ## 请求方式
  - PUT

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
|project_id|是|uint|项目 ID|
|user_id|是|uint|置 is_leader 并赋全权限|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
