info:
  name: 成员_添加
  type: http
  seq: 14

http:
  method: POST
  url: "{{host}}/api/project/member"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 成员_添加

  ## 请求 URI
  - `/api/project/member`

  ## 请求方式
  - POST

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
|project_id|是|uint|需负责人或管理员|
|user_id|是|uint|用户 ID|
|permission|否|int|位掩码 1查 2增 4改 8删 15全，缺省 1|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
