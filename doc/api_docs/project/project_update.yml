info:
  name: 项目_更新
  type: http
  seq: 11

http:
  method: PUT
  url: "{{host}}/api/project"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 项目_更新

  ## 请求 URI
  - `/api/project`

  ## 请求方式
  - PUT

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
|id|是|uint|项目 ID|
|title|否|string|标题|
|description|否|string|描述|
|version|否|string|版本|
|type|否|string|类型|
|client_write_enabled|否|bool|null|是否允许桌面客户端写入（S14）；不传 = 不变，传 null 同不传|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限
  - 14 失败：改名为已被其它未删除项目占用的名称时返回 `项目名称「xxx」已存在，请更换名称`

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
  - `title` 为空表示不改名；名称唯一性校验排除自身与软删除项目。
  - `client_write_enabled=false` 时桌面客户端 push 会被逐条拒绝（`rejected.readonly`），拉取不受影响。
