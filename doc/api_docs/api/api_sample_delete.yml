info:
  name: 接口_删除响应示例
  type: http
  seq: 43

http:
  method: DELETE
  url: "{{host}}/api/api/sample"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 接口_删除响应示例（物理删除；删除会写入同步流水，向客户端传播）

  ## 请求 URI
  - `/api/api/sample`

  ## 请求方式
  - DELETE

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |id|是|uint|示例 ID|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": null }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 需要项目 update 权限位。
