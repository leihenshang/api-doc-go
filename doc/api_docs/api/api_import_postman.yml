info:
  name: 接口_导入 Postman
  type: http
  seq: 84

http:
  method: POST
  url: "{{host}}/api/api/import-postman?project_id=&strategy="
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 接口_导入 Postman

  ## 请求 URI
  - `/api/api/import-postman?project_id=&strategy=`

  ## 请求方式
  - POST

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |project_id|是|uint|目标项目 ID（查询参数）|
  |strategy|否|string|append（只新增，默认）/ overwrite（清空后导入）|
  |（请求体）|是|json|Postman 导出的 Collection v2.x JSON 文本|
  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200（**Mock 服务除外**，见备注）
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
  - 文件夹 → 接口分组（同名同父复用），请求 → 接口；URL 查询串与 **raw JSON 请求体** 展平为请求参数，请求头写入 `http_request_header`。
    - 去重口径与 OpenAPI / Bruno 导入一致（方法 + URL），重复项计入 `skipped`；来源标记 `source = postman-import`。
    - 返回 `{ imported, skipped, failed, failures[] }`；非 Collection JSON 报 22。