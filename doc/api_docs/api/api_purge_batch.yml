info:
  name: 接口_回收站批量彻底删除
  type: http
  seq: 86

http:
  method: POST
  url: "{{host}}/api/api/purge-batch"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 接口_回收站批量彻底删除

  ## 请求 URI
  - `/api/api/purge-batch`

  ## 请求方式
  - POST

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`；权限按条目所属项目校验

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |ids|是|uint[]|条目 id 数组（当前页勾选结果；空数组报 22）|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期 / 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
  - **彻底删除（不可撤销）**：物理删除记录，不再保留在回收站；需项目 **delete** 权限。
  - 返回 `{ purged }`（受影响行数）；写一条操作日志（action=purge）。
  - 仅能从回收站中的条目发起；误删后只能依赖数据库备份恢复。