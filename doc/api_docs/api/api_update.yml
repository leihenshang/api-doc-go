info:
  name: 接口_更新
  type: http
  seq: 24

http:
  method: PUT
  url: "{{host}}/api/api"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 接口_更新

  ## 请求 URI
  - `/api/api`

  ## 请求方式
  - PUT

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
|id|是|uint|接口 ID|
|status|否|int|0 保持原值；1/2/3 修改状态；进入废弃自动补时间，回到其它状态清空|
|version|否|string|空串保持原值；≤50 字符|
|deprecated_at|否|time|仅在 status=3 时生效；不传沿用旧值/补当前时间|
|（其余字段同 api_create，整体覆盖式更新）||||

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
