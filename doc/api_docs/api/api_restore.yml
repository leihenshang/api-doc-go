info:
  name: 接口_恢复
  type: http
  seq: 28

http:
  method: POST
  url: "{{host}}/api/api/restore"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 接口_恢复

  ## 请求 URI
  - `/api/api/restore`

  ## 请求方式
  - POST

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |id|是|uint|还原接口及所属分组|
  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  - 返回 `{ restored, groups }`：恢复的接口数与**随之恢复的所属分组数**（会一并恢复已删除的分组祖先链，避免还原后落到「未分组」）。
  - 权限：按条目所属项目校验 update 位；写操作日志。

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
