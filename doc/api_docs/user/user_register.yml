info:
  name: 用户_注册
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/api/user/register"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 用户_注册

  ## 请求 URI
  - `/api/user/register`

  ## 请求方式
  - POST

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
|name|是|string|登录名|
|pwd|是|string|密码|
|re_pwd|是|string|确认密码|
|email|否|string|邮箱|
|nick_name|否|string|昵称（缺省自动生成）|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
