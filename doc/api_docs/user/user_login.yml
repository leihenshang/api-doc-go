info:
  name: 用户_登录
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/api/user/login"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 用户_登录

  ## 请求 URI
  - `/api/user/login`

  ## 请求方式
  - POST

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
|name|是|string|登录名|
|pwd|是|string|密码|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
  - `data.user` 为完整用户对象（`pwd` 不返回），含界面语言 `lang`（`""`=未设置，前端按浏览器语言兜底）；前端登录后用 `data.user.lang` 决定界面语言。
