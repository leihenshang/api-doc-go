info:
  name: 用户_修改密码
  type: http
  seq: 7

http:
  method: PUT
  url: "{{host}}/api/user/password"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 用户_修改密码

  ## 请求 URI
  - `/api/user/password`

  ## 请求方式
  - PUT

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
|old_pwd|是|string|原密码|
|pwd|是|string|新密码|
|re_pwd|是|string|确认新密码|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
