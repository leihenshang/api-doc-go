info:
  name: 用户_查重
  type: http
  seq: 5

http:
  method: GET
  url: "{{host}}/api/user/check-repeat"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 用户_查重

  ## 请求 URI
  - `/api/user/check-repeat`

  ## 请求方式
  - GET

  ## 鉴权
  - 无需登录（供注册页未登录时查重调用）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
|keyword|是|string|按名字/邮箱/昵称匹配|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
