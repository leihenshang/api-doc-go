info:
  name: 用户_更新资料
  type: http
  seq: 6

http:
  method: PUT
  url: "{{host}}/api/user/profile"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 用户_更新资料

  ## 请求 URI
  - `/api/user/profile`

  ## 请求方式
  - PUT

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`（仅 login/register 免鉴权）

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
|id|否|uint|目标用户（缺省本人；改 type/state 需管理员）|
|nick_name|否|string|昵称|
|email|否|string|邮箱|
|user_face|否|string|头像|
|lang|否|string|界面语言 zh-CN / en-US（本人即可改；其它值返回 22；空串=不改）|
|state|否|int|1 正常 2 禁用（管理员）|
|type|否|int|1 普通 2 管理员 3 超管（管理员）|

  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
  - 本人可改 `nick_name` / `email` / `user_face` / `lang`；`state` / `type` 仅管理员。`lang` 为 i18n 语言偏好，登录与 `/api/user/me` 的 user 对象会带上；前端切换语言后即调用本接口持久化（未登录时仅存 localStorage）。
