info:
  name: 分享链接_创建
  type: http
  seq: 78

http:
  method: POST
  url: "{{host}}/api/share"
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 分享链接_创建

  ## 请求 URI
  - `/api/share`

  ## 请求方式
  - POST

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |project_id|是|uint|项目 ID|
  |remark|否|string|备注（给谁看、用途）|
  |expire_days|否|int|有效期天数，0/缺省 = 永久有效|
  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200（**Mock 服务除外**，见备注）
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
  - 生成的 `token` 为 32 位十六进制随机串；访问地址为前端路由 `/share/<token>`（免登录只读）。
    - 权限：需项目 `update` 位（管理员放行）；写操作记操作日志 `分享链接:<备注>`。