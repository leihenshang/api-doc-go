info:
  name: 分享链接_列表
  type: http
  seq: 79

http:
  method: GET
  url: "{{host}}/api/share?project_id="
  headers:
    - name: Authorization
      value: "{{Authorization}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  timeout: 0

docs: |-
  ## 简要描述
  - 分享链接_列表

  ## 请求 URI
  - `/api/share?project_id=`

  ## 请求方式
  - GET

  ## 鉴权
  - 请求头 `Authorization: Bearer <JWT>`

  ## 请求参数
  |参数名|必选|类型|说明|
  |:--|:--|:--|:--|
  |project_id|是|uint|项目 ID|
  ## 统一响应
  - `{ "code": 200, "msg": "success", "data": ... }`，HTTP 状态码恒为 200（**Mock 服务除外**，见备注）
  - 错误码：200 成功 / 22 参数错误 / 14 失败 / 34 未登录或过期（前端跳登录）/ 403 无权限

  ## 备注
  - 契约实现见 backend `internal/dto/dto.go` 与对应 handler。
  - 返回项目下全部未删除分享链接（新建在前），含 `token` / `remark` / `expire_time`。